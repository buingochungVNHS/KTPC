<title>KTPC – Tổng hợp</title>
<style>

  header .phu { font-size: 13px; opacity: .9; text-align: right; }
  header .chuaLuu { color: #ffd27a; font-weight: 600; }
  main { max-width: 760px; margin: 0 auto; padding: 8px; }
  .the { background: var(--the); border: 1px solid var(--vien); border-radius: 12px; padding: 12px; margin-bottom: 10px; }
  h2 { font-size: 16px; margin: 0 0 8px; color: var(--chinh); }
  label { display: block; font-size: 14px; color: var(--mo); }

  input.o:focus, textarea.o:focus { outline: none; border-color: var(--nhan); box-shadow: 0 0 0 3px rgba(29,95,168,.15); }
  input.o.sai { border-color: var(--KD); background: #fdecea; }
  .nut { display: inline-block; border: 1.5px solid var(--nhan); background: #fff; color: var(--nhan); border-radius: 8px;
    font-size: 15px; padding: 0 14px; height: 42px; font-weight: 600; cursor: pointer; }
  .nut.chinh { background: var(--nhan); color: #fff; }
  .nut.do { border-color: var(--KD); color: var(--KD); }
  .nut.nho { height: 32px; font-size: 13px; padding: 0 10px; }
  .hang { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .hang > * { flex: 1 1 auto; }
  .luoi2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .nho { color: var(--mo); font-size: 13px; }
  .loi { color: var(--KD); }
  .an { display: none !important; }

  nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: #fff; border-top: 1px solid var(--vien);
    display: flex; padding-bottom: env(safe-area-inset-bottom); }
  nav button { flex: 1; border: 0; background: none; height: 56px; font-size: 14px; color: var(--mo); }
  nav button.chon { color: var(--chinh); font-weight: 700; box-shadow: inset 0 3px 0 var(--chinh); }

  .chip { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
  .chip button { flex: 0 0 auto; border: 1.5px solid var(--vien); background: #fff; border-radius: 18px; height: 36px; padding: 0 12px; font-size: 14px; color: var(--chu); }

/* ===== KHỐI CHẤM ĐIỂM CHUNG – ỨNG DỤNG KIỂM TRA PHÂN CẤP =====
 * Dùng chung, giống hệt nhau trong TONG_HOP.html và TU_TINH.html.
 * Căn cứ: NGUYEN_TAC_KIEM_TRA_PHAN_CAP.md mục 4, 5, 6, 7.1.

 * VÒNG QUAY TRỤ, BƠI). Điểm trong Excel có sai số dấu phẩy động (5.00000000000002) đã làm tròn 1 chữ số.
 */
(function (root) {
  'use strict';

  var EPS = 1e-9;

  // Môn: ten, donVi, chieu (-1: càng ít càng tốt; +1: càng nhiều càng tốt)

    'boi':   { ten: 'Bơi', donVi: 'm', chieu: +1 }
  };

  var TEN_NHOM = ['Dưới 36', 'Từ 36 đến dưới 46', 'Từ 46 đến dưới 52', 'Từ 52 trở lên'];

  // Bảng chuẩn: [thành tích, điểm], xếp từ kém nhất đến tốt nhất. 1500m tính bằng giây.
  var BANG = {
    '1500m': [
      /* <36 */ [[580,0.5],[561,1],[536,1.5],[501,2],[476,2.5],[451,3],[431,3.5],[411,4],[391,4.5],[390,5],[385,5.2],[380,5.4],[375,5.6],[370,5.8],[365,6],[360,6.2],[355,6.4],[350,6.6],[345,6.8],[340,7],[334,7.2],[328,7.4],[322,7.6],[316,7.8],[310,8],[308,8.2],[306,8.4],[304,8.6],[302,8.8],[300,9],[298,9.2],[296,9.4],[294,9.6],[292,9.8],[290,10]],

      /* 46-52 */ [[700,1],[670,1.5],[640,2],[610,2.5],[580,3],[550,3.5],[530,4],[510,4.5],[490,5],[486,5.2],[482,5.4],[478,5.6],[475,5.8],[472,6],[468,6.2],[464,6.4],[460,6.6],[455,6.8],[450,7],[446,7.2],[442,7.4],[438,7.6],[434,7.8],[430,8],[428,8.2],[426,8.4],[424,8.6],[422,8.8],[420,9],[418,9.2],[416,9.4],[414,9.6],[412,9.8],[410,10]],

    ],
    '50x2': [
      /* <36 */ [[20,0.5],[19.6,1],[19.4,1.5],[19.2,2],[19,2.5],[18.8,3],[18.4,3.5],[18,4],[17.6,4.5],[17.4,5],[17.3,5.4],[17.2,5.8],[17.1,6.2],[17,6.4],[16.9,6.6],[16.8,7.2],[16.7,7.8],[16.6,8],[16.4,8.2],[16.2,8.4],[16,8.6],[15.8,8.8],[15.6,9],[15.4,9.2],[15.2,9.4],[15,9.6],[14.8,9.8],[14.6,10]],
      /* 36-46 */ [[20.4,0.5],[20,1],[19.6,1.5],[19.4,2],[19.2,2.5],[19,3],[18.8,3.5],[18.4,4],[18,4.5],[17.6,5],[17.5,5.8],[17.4,6.4],[17.3,6.6],[17.2,7.2],[17.1,7.8],[17,8],[16.8,8.2],[16.6,8.4],[16.4,8.6],[16.2,8.8],[16,9],[15.8,9.2],[15.6,9.4],[15.4,9.6],[15.2,9.8],[15,10]],
      /* 46-52 */ [[21.2,0.5],[20.8,1],[20.4,1.5],[20,2],[19.6,2.5],[19.4,3],[19.2,3.5],[19,4],[18.8,4.5],[18.4,5],[18.3,5.4],[18.2,5.8],[18.1,6.2],[18,6.6],[17.9,7],[17.8,7.4],[17.7,7.8],[17.6,8],[17.4,8.2],[17.2,8.4],[17,8.6],[16.8,8.8],[16.6,9],[16.4,9.2],[16.2,9.4],[16,9.6],[15.8,9.8],[15.6,10]],
      /* >=52 */ [[22.4,0.5],[22,1],[21.6,1.5],[21.2,2],[20.8,2.5],[20.4,3],[20,3.5],[19.6,4],[19.4,4.5],[19.2,5],[19,5.4],[18.8,5.8],[18.7,6.2],[18.6,6.6],[18.5,7],[18.4,7.2],[18.3,7.4],[18.2,7.6],[18.1,7.8],[18,8],[17.8,8.2],[17.6,8.4],[17.4,8.6],[17.2,8.8],[17,9],[16.8,9.2],[16.6,9.4],[16.4,9.6],[16.2,9.8],[16,10]]
    ],
    'vqt': [
      /* <36 */ [[15,1],[20,2],[25,3],[30,4],[35,5],[36,5.4],[37,5.8],[38,6.2],[39,6.4],[40,6.6],[41,7],[42,7.2],[43,7.6],[44,7.8],[45,8],[47,8.2],[49,8.4],[51,8.6],[53,8.8],[55,9],[57,9.2],[59,9.4],[61,9.6],[63,9.8],[65,10]],
      /* 36-46 */ [[10,1],[15,2],[20,3],[25,4],[30,5],[31,5.4],[32,5.8],[33,6.2],[34,6.4],[35,6.6],[36,7],[37,7.2],[38,7.6],[39,7.8],[40,8],[42,8.2],[44,8.4],[46,8.6],[48,8.8],[50,9],[52,9.2],[54,9.4],[56,9.6],[58,9.8],[60,10]],
      /* 46-52 */ [[10,1],[15,2],[20,3],[25,4],[30,5],[31,5.4],[32,5.8],[33,6.2],[34,6.4],[35,6.6],[36,7],[37,7.4],[38,7.6],[39,7.8],[40,8],[41,8.2],[42,8.4],[43,8.6],[44,8.8],[45,9],[46,9.2],[47,9.4],[48,9.6],[49,9.8],[50,10]],
      /* >=52 */ [[5,1],[10,2],[15,3],[20,4],[25,5],[26,5.4],[27,5.8],[28,6.2],[29,6.4],[30,6.6],[31,7],[32,7.4],[33,7.6],[34,7.8],[35,8],[36,8.2],[37,8.4],[38,8.6],[39,8.8],[40,9],[41,9.2],[42,9.4],[43,9.6],[44,9.8],[45,10]]
    ],
    'boi': [
      /* <36 */ [[30,1],[40,2],[50,3],[60,4],[70,5],[72,5.2],[74,5.4],[76,5.6],[79,5.8],[83,6],[87,6.2],[91,6.4],[95,6.6],[99,6.8],[103,7],[107,7.2],[111,7.4],[115,7.6],[118,7.8],[120,8],[122,8.2],[124,8.4],[126,8.6],[128,8.8],[130,9],[135,9.2],[140,9.4],[145,9.6],[150,9.8],[160,10]],
      /* 36-46 */ [[10,1],[20,2],[30,3],[40,4],[50,5],[52,5.2],[54,5.4],[56,5.6],[58,5.8],[60,6],[62,6.2],[66,6.4],[70,6.6],[74,6.8],[78,7],[82,7.2],[84,7.4],[86,7.6],[88,7.8],[90,8],[92,8.2],[94,8.4],[96,8.6],[98,8.8],[100,9],[105,9.2],[110,9.4],[115,9.6],[120,9.8],[130,10]],
      /* 46-52 */ [[10,1],[20,2],[30,3],[40,4],[50,5],[52,5.2],[53,5.4],[55,5.6],[57,5.8],[59,6],[61,6.2],[63,6.4],[65,6.6],[68,6.8],[70,7],[72,7.2],[74,7.4],[76,7.6],[78,7.8],[80,8],[82,8.2],[84,8.4],[86,8.6],[88,8.8],[90,9],[92,9.2],[94,9.4],[96,9.6],[98,9.8],[100,10]],
      /* >=52 */ [[5,1],[10,2],[20,3],[30,4],[40,5],[42,5.2],[44,5.4],[45,5.6],[46,5.8],[47,6],[48,6.2],[49,6.4],[50,6.6],[53,6.8],[55,7],[57,7.2],[59,7.4],[61,7.6],[63,7.8],[65,8],[67,8.2],[69,8.4],[71,8.6],[73,8.8],[75,9],[77,9.2],[79,9.4],[81,9.6],[83,9.8],[85,10]]
    ]
  };

  /* ---------- Ngày, tuổi, nhóm tuổi (mục 4) ---------- */
  // Nhận Date hoặc chuỗi 'YYYY-MM-DD' / 'DD/MM/YYYY'. Trả {y,m,d} hoặc null.
  function docNgay(v) {
    if (v == null || v === '') return null;
    if (v instanceof Date) return isNaN(v) ? null : { y: v.getFullYear(), m: v.getMonth() + 1, d: v.getDate() };
    var s = String(v).trim(), a;
    if ((a = /^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(s))) return { y: +a[1], m: +a[2], d: +a[3] };
    if ((a = /^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})$/.exec(s))) return { y: +a[3], m: +a[2], d: +a[1] };
    return null;
  }

  // Tuổi = số năm tròn từ ngày sinh đến ngày kiểm tra.
  function tinhTuoi(ngaySinh, ngayKiemTra) {
    var s = docNgay(ngaySinh), k = docNgay(ngayKiemTra);
    if (!s || !k) return null;
    var t = k.y - s.y;
    if (k.m < s.m || (k.m === s.m && k.d < s.d)) t--;
    return t;
  }

  // 0: dưới 36; 1: 36–<46; 2: 46–<52; 3: từ 52.
  function nhomTuoi(tuoi) {
    if (tuoi == null || isNaN(tuoi)) return null;
    if (tuoi < 36) return 0;
    if (tuoi < 46) return 1;
    if (tuoi < 52) return 2;
    return 3;
  }

  /* ---------- Điểm từng môn (mục 5) ---------- */
  function soHop(x) { return typeof x === 'number' && isFinite(x); }

  function diemMon(mon, thanhTich, nhom) {
    if (!soHop(thanhTich) || nhom == null || !BANG[mon]) return null;
    var p = BANG[mon][nhom], c = MON[mon].chieu, k = c * thanhTich;
    if (k < c * p[0][0] - EPS) return 0.5;                 // kém hơn mốc thấp nhất
    if (k >= c * p[p.length - 1][0] - EPS) return 10;      // đạt hoặc tốt hơn mốc cao nhất
    for (var i = 0; i < p.length - 1; i++) {
      var x1 = p[i][0], y1 = p[i][1], x2 = p[i + 1][0], y2 = p[i + 1][1];
      if (k >= c * x1 - EPS && k < c * x2 - EPS) {
        return y1 + (y2 - y1) * (thanhTich - x1) / (x2 - x1);  // nội suy tuyến tính
      }
    }
    return null;
  }

  // Điểm thể lực = trung bình 4 môn; thiếu môn nào thì null.
  function diemTheLuc(d) {
    var s = 0;
    for (var i = 0; i < 4; i++) { if (!soHop(d[i])) return null; s += d[i]; }
    return s / 4;
  }

  // Chấm 1 người: tt = {'1500m':giây,'50x2':giây,'vqt':vòng,'boi':m}
  function chamTheLuc(tt, nhom) {
    var dm = {}, arr = [];
    DS_MON.forEach(function (m) { dm[m] = diemMon(m, tt ? tt[m] : null, nhom); arr.push(dm[m]); });
    var tl = diemTheLuc(arr);
    return { diemMon: dm, diemTheLuc: tl, xepLoai: xepLoai(tl) };
  }

  /* ---------- Xếp loại, làm tròn (mục 6) ---------- */
  function xepLoai(diem) {
    if (!soHop(diem)) return '';
    if (diem >= 8 - EPS) return 'G';
    if (diem >= 7 - EPS) return 'K';
    if (diem >= 5 - EPS) return 'Đ';
    return 'KĐ';
  }
  function lamTron2(x) {
    if (!soHop(x)) return null;
    return Math.round(Number((x * 100).toFixed(6))) / 100;
  }

  /* ---------- Tra ngược thành tích (mục 7.1) ---------- */
  var BUOC = { '1500m': 1, '50x2': 0.001, 'vqt': 1, 'boi': 1 };
  function lamTronDamBao(mon, x) {

<script id="ung-dung">
(function () {
  'use strict';
  var CD = window.ChamDiem, TV = window.TepVP, XL = window.XuLy, MAU = window.MAU_BAO_CAO;
  var KHOA = 'KTPC_TONG_HOP_v1';
  var TEN_XL = { 'G': 'Giỏi', 'K': 'Khá', 'Đ': 'Đạt', 'KĐ': 'Không đạt' };
  // Nội dung chấm: k = khóa ô nhập
  var NOI_DUNG = [
    { id: '1500m', ten: '1500m' }, { id: '50x2', ten: '50m×2' }, { id: 'vqt', ten: 'VQT' }, { id: 'boi', ten: 'Bơi' },
    { id: 'lt', ten: 'Lý thuyết' }, { id: 'ct', ten: 'Chính trị' }, { id: 'thb', ten: 'THB' }
  ];
  var MIME_XLSX = 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
  var MIME_DOCX = 'application/vnd.openxmlformats-officedocument.wordprocessingml.document';

  /* ---------- Tiện ích ---------- */
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function homNay() { var t = new Date(); return pad(t.getDate()) + '/' + pad(t.getMonth() + 1) + '/' + t.getFullYear(); }
  function oXL(x) { return x ? '<span class="xl xl-' + x + '">' + x + '</span>' : ''; }
  var hen;
  function bao(t) { var e = $('thongBao'); e.textContent = t; e.classList.remove('an'); clearTimeout(hen); hen = setTimeout(function () { e.classList.add('an'); }, 3200); }

  /* ---------- Dữ liệu ---------- */
  function taiLai() {
    try { var o = JSON.parse(localStorage.getItem(KHOA)); if (o && Array.isArray(o.ds)) return o; } catch (e) {}
    return null;
  }
  var S = taiLai() || XL.kyMoi();
  var UI = { tab: S.ds.length ? 'cham' : 'ky', nd: '1500m', tim: '', chua: false, dan: null, danND: 'lt' };
  function luu() { try { localStorage.setItem(KHOA, JSON.stringify(S)); } catch (e) { bao('Không lưu được trên thiết bị: ' + e.message); } }
  function doi() { S.doi = (S.doi || 0) + 1; luu(); veTrangThai(); }

  function veTrangThai() {
    var h = S.ngayKT ? 'Ngày KT ' + S.ngayKT : 'Chưa có ngày KT';
    if (S.doi) h += '<br><span class="chuaLuu">' + S.doi + ' thay đổi chưa lưu phiên</span>';
    else if (S.luuLuc) h += '<br>Đã lưu phiên ' + esc(S.luuLuc);
    $('trangThai').innerHTML = h;
  }

  /* ---------- Ô nhập ---------- */
  function giaTri(p, k) {
    if (k === '1500p') return p.tt['1500m'].p;
    if (k === '1500g') return p.tt['1500m'].g;
    if (k === '50x2' || k === 'vqt' || k === 'boi') return p.tt[k];
    return p[k];
  }
  function datGiaTri(p, k, v) {
    if (k === '1500p') p.tt['1500m'].p = v;
    else if (k === '1500g') p.tt['1500m'].g = v;
    else if (k === '50x2' || k === 'vqt' || k === 'boi') p.tt[k] = v;
    else p[k] = v;
  }
  function oNhap(p, nd) {
    var a = ' data-ma="' + esc(p.ma) + '" autocomplete="off" enterkeyhint="next"';
    if (nd === '1500m') return '<input class="o so2" inputmode="numeric" maxlength="2" placeholder="ph" data-k="1500p"' + a + ' value="' + esc(giaTri(p, '1500p')) + '">' +
      '<span>\'</span><input class="o so2" inputmode="numeric" maxlength="2" placeholder="gi" data-k="1500g"' + a + ' value="' + esc(giaTri(p, '1500g')) + '">';
    var im = nd === 'vqt' || nd === 'boi' ? 'numeric' : 'decimal';
    var ph = { '50x2': 'giây', vqt: 'vòng', boi: 'mét', lt: 'điểm', ct: 'điểm', thb: 'điểm' }[nd];
    return '<input class="o" inputmode="' + im + '" placeholder="' + ph + '" data-k="' + nd + '"' + a + ' value="' + esc(giaTri(p, nd)) + '">';
  }
  function diemND(k, nd) {
    if (nd === 'lt' || nd === 'ct' || nd === 'thb') return k.diem[nd];
    return k.diemMon[nd];
  }
  function coDuLieu(p, nd) {
    if (nd === '1500m') return p.tt['1500m'].p !== '' || p.tt['1500m'].g !== '';
    return String(giaTri(p, nd) || '') !== '';
  }
  function hienDiem(x) { return x == null ? '—' : XL.fmt2(x); }

  /* ---------- Tab Chấm ---------- */
  function veCham() {
    var ds = XL.dangThi(S), h = '';
    if (!ds.length) { $('tab-cham').innerHTML = '<div class="the">Chưa có danh sách. Vào tab <b>Kỳ KT</b> để nạp CSDL.</div>'; return; }
    h += '<div class="the"><div class="chip">' + NOI_DUNG.map(function (n) {
      return '<button type="button" data-nd="' + n.id + '"' + (UI.nd === n.id ? ' class="chon"' : '') + '>' + n.ten + '</button>';
    }).join('') + '</div><div class="loc"><input class="o" id="tim" placeholder="Tìm tên / mã" value="' + esc(UI.tim) + '" autocomplete="off">' +
      '<label><input type="checkbox" id="locChua"' + (UI.chua ? ' checked' : '') + '> Chưa có</label></div><div class="dem" id="demCham"></div></div>';
    h += '<div class="ds" id="dsCham">';
    var stt = 0;
    S.ds.forEach(function (p) {
      if (p.bo) return; stt++;
      var k = XL.tinh(p, S.ngayKT);
      h += '<div class="dong' + (coDuLieu(p, UI.nd) ? ' xong' : '') + '" data-dong="' + esc(p.ma) + '"><span class="stt">' + stt + '</span>' +
        '<div class="ten"><b data-mo="' + esc(p.ma) + '">' + esc(p.ten) + '</b><span>' + esc(p.quanHam) +
        (k.tuoi != null ? ' · ' + k.tuoi + ' tuổi' : ' · <span class="loi">thiếu ngày sinh</span>') + '</span></div>' +
        '<div class="nhap">' + oNhap(p, UI.nd) + '</div><span class="diem" data-diem="' + esc(p.ma) + '">' + hienDiem(diemND(k, UI.nd)) + '</span></div>';
    });
    h += '</div>';
    $('tab-cham').innerHTML = h;
    locDong(); demCham();
  }
  // Lọc bằng ẩn/hiện dòng (không vẽ lại để không mất chữ đang gõ)
  function locDong() {
    var t = XL.chuan(UI.tim), tk = XL.boDau(UI.tim);
    Array.prototype.forEach.call(document.querySelectorAll('#dsCham .dong'), function (d) {
      var p = XL.timMa(S, d.getAttribute('data-dong')), hien = true;
      if (t && XL.chuan(p.ten).indexOf(t) < 0 && XL.chuan(p.ma).indexOf(t) < 0 && XL.boDau(p.ten).indexOf(tk) < 0) hien = false;
      if (UI.chua && coDuLieu(p, UI.nd)) hien = false;
      d.classList.toggle('an', !hien);
    });
  }
  function demCham() {
    var ds = XL.dangThi(S), c = ds.filter(function (p) { return coDuLieu(p, UI.nd); }).length, e = $('demCham');
    if (e) e.textContent = 'Đã có ' + c + '/' + ds.length + ' người' + (S.ngayKT ? '' : ' · Chưa nhập ngày kiểm tra (tab Kỳ KT)');
  }

  /* ---------- Hộp một người ---------- */
  var MA_MO = null;
  function moNguoi(ma) { MA_MO = ma; veNguoi(); $('nguoi').classList.remove('an'); }
  function dongNguoi() { MA_MO = null; $('nguoi').classList.add('an'); $('nguoi').innerHTML = ''; veTab(); }
  function veNguoi() {
    var p = XL.timMa(S, MA_MO); if (!p) return dongNguoi();
    var k = XL.tinh(p, S.ngayKT), h = '<div class="hop"><div class="hang" style="align-items:flex-start"><div style="flex:1">' +
      '<h2 style="margin:0">' + esc(p.ten) + '</h2><div class="nho">' + esc(p.ma) + ' · ' + esc(p.quanHam) + (p.donVi ? ' · ' + esc(p.donVi) : '') +
      ' · ' + (k.tuoi != null ? k.tuoi + ' tuổi – ' + CD.TEN_NHOM[k.nhom] : 'chưa tính được tuổi') + '</div></div>' +
      '<button type="button" class="nut nho" data-dong-nguoi="1" style="flex:0 0 auto">Đóng</button></div><div class="the" style="margin-top:10px">';
    NOI_DUNG.forEach(function (n) {
      h += '<div class="muc"><span class="nh">' + n.ten + '</span><span class="nhap">' + oNhap(p, n.id) + '</span>' +
        '<span class="diem" data-diem-ng="' + n.id + '">' + hienDiem(diemND(k, n.id)) + '</span></div>';
    });
    h += '</div><div class="the" id="tomNguoi"></div>' +
      '<button type="button" class="nut do" data-bo="' + esc(p.ma) + '">' + (p.bo ? 'Thêm lại vào kỳ' : 'Bớt khỏi kỳ') + '</button></div>';
    $('nguoi').innerHTML = h;
    veTomNguoi();
  }
  function veTomNguoi() {
    var p = XL.timMa(S, MA_MO), e = $('tomNguoi'); if (!p || !e) return;
    var k = XL.tinh(p, S.ngayKT);
    e.innerHTML = '<table class="bang"><tr><th></th><th>Điểm</th><th>XL</th></tr>' + XL.ND.map(function (n) {
      return '<tr><td class="trai">' + XL.TEN_ND[n] + '</td><td>' + (k.diem[n] == null ? '' : XL.fmt2(k.diem[n])) + '</td><td>' + oXL(k.xl[n]) + '</td></tr>';
    }).join('') + '</table>';
    CD.DS_MON.concat(['lt', 'ct', 'thb']).forEach(function (n) {
      var d = document.querySelector('[data-diem-ng="' + n + '"]'); if (d) d.textContent = hienDiem(diemND(k, n));
    });
  }

  /* ---------- Xử lý nhập ---------- */
  function capNhatDiem(p) {
    var k = XL.tinh(p, S.ngayKT), d = document.querySelector('#dsCham [data-diem="' + cssEsc(p.ma) + '"]');
    if (d) { d.textContent = hienDiem(diemND(k, UI.nd)); d.parentNode.classList.toggle('xong', coDuLieu(p, UI.nd)); }
    if (MA_MO === p.ma) veTomNguoi();

  function xuatWord() {
    if (!XL.dangThi(S).length) return bao('Chưa có danh sách.');
    if (!S.ngayKT) return bao('Nhập ngày kiểm tra trước.');
    var bc = XL.duLieuBaoCao(S), n = CD.docNgay(S.ngayKT);
    guiTep(TV.docxDien(MAU, bc.dong, bc.tongHop), 'BAO_CAO_KTPC_' + n.y + pad(n.m) + pad(n.d) + '.docx', MIME_DOCX);
  }
  function luuPhien() {
    if (!S.ds.length) return bao('Chưa có dữ liệu.');
    var ten = XL.tenTepPhien(S);
    guiTep(XL.taoPhien(S), ten, MIME_XLSX).then(function (xong) {
      if (!xong) return;
      var t = new Date(); S.doi = 0; S.luuLuc = pad(t.getHours()) + ':' + pad(t.getMinutes()) + ' ' + pad(t.getDate()) + '/' + pad(t.getMonth() + 1);
      luu(); veTrangThai();
    });
  }
  $('chonCSDL').addEventListener('change', function () {
    var inp = this;
    docTep(inp).then(TV.xlsxDoc).then(function (sh) {
      var c = XL.docCSDL(sh);
      if (c.loi) return bao(c.loi);
      if (!c.ds.length) return bao('Không có người "Đang bay" trong NHAN_SU.');
      var r = XL.napCSDL(S, c.ds);
      if (!S.ngayKT) S.ngayKT = homNay();
      S.doi = (S.doi || 0) + 1; luu(); veTrangThai(); veTab();
      bao('Đã nạp CSDL: thêm ' + r.them + ' người, cập nhật ' + r.capNhat + ' thông tin.');
    }).catch(function (e) { bao('Lỗi: ' + e.message); });
  });
  $('chonPhien').addEventListener('change', function () {
    var inp = this;
    docTep(inp).then(TV.xlsxDoc).then(function (sh) {
      var r = XL.docPhien(sh);
      if (r.loi) return bao(r.loi);
      var msg = 'Mở phiên: ' + XL.dangThi(r.S).length + ' người, ngày KT ' + (r.S.ngayKT || '?') + '.\nThay toàn bộ dữ liệu đang có trên máy?';
      if (S.doi) msg += '\n(Dữ liệu hiện tại còn ' + S.doi + ' thay đổi chưa lưu phiên.)';
      if (!confirm(msg)) return;
      S = r.S; S.doi = 0; S.luuLuc = ''; luu(); veTrangThai(); UI.tab = 'cham'; veTab(); bao('Đã mở phiên.');
    }).catch(function (e) { bao('Lỗi: ' + e.message); });
  });

  /* ---------- Vẽ ---------- */
  function veTab() {
    ['cham', 'dan', 'tinh', 'ky'].forEach(function (t) { $('tab-' + t).classList.toggle('an', t !== UI.tab); });
    Array.prototype.forEach.call(document.querySelectorAll('nav button'), function (b) { b.classList.toggle('chon', b.getAttribute('data-tab') === UI.tab); });
    if (UI.tab === 'cham') veCham(); else if (UI.tab === 'dan') veDan(); else if (UI.tab === 'tinh') veTinh(); else veKy();
  }
  veTrangThai(); veTab();

  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    var dangKy = function () { navigator.serviceWorker.register('sw.js').catch(function () {}); };
    if (document.readyState === 'complete') dangKy(); else window.addEventListener('load', dangKy);
  }
  window.TongHop = { S: function () { return S; }, moNguoi: moNguoi };
})();
</script>
